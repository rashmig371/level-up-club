name: Deploy Level Up Club
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test date and backup logic
        run: |
          node --test tests/*.test.js
          python -m unittest discover -s tests -p "*_test.py"
      - name: Prepare public assets only
        run: |
          mkdir site
          cp index.html style.css app.js core.js plan.js business-plan.js catalog.js icon.svg study-content.js study-ui.js market.js site/
      - name: Refresh public news headlines
        run: python scripts/refresh_news.py --output site/news.json --previous news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
